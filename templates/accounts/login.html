{% extends 'base.html' %}

{% block title %}Iniciar Sesión | ACADEMIX{% endblock %}

{% block auth_content %}
<div class="login-bg">
    <div class="login-card p-4 p-sm-5 animate__animated animate__fadeIn">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle mb-3 shadow-sm" style="background: linear-gradient(135deg, #c4b5fd 0%, #b892ff 100%); color: #3b0764; width: 68px; height: 68px; align-items: center; justify-content: center;">
                <i class="bi bi-mortarboard-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">ACADEMIX</h3>
            <p class="text-muted small">Gestión Académica, Calificaciones y Auditoría</p>
        </div>

        <!-- Contenedor del formulario de Login -->
        <div id="login-form-container">
            {% include 'accounts/partials/login_form.html' %}
        </div>

        <div class="text-center mt-4 text-muted small">
            <span style="font-size: 0.75rem;"><i class="bi bi-shield-check text-purple me-1"></i>Plataforma Educativa Segura y Auditada</span>
        </div>
    </div>
</div>
{% endblock %}
