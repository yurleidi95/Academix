<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
    {% if messages %}
        {% for message in messages %}
        <div class="toast align-items-center {% if message.tags == 'error' %}bg-danger text-white{% elif message.tags == 'warning' %}bg-warning text-dark{% elif message.tags == 'success' %}bg-success text-white{% else %}bg-primary text-white{% endif %} border-0 show shadow mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    {% if message.tags == 'error' %}
                        <i class="bi bi-x-circle-fill fs-5"></i>
                    {% elif message.tags == 'warning' %}
                        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                    {% elif message.tags == 'success' %}
                        <i class="bi bi-check-circle-fill fs-5"></i>
                    {% else %}
                        <i class="bi bi-info-circle-fill fs-5"></i>
                    {% endif %}
                    <span>{{ message }}</span>
                </div>
                <button type="button" class="btn-close {% if message.tags != 'warning' %}btn-close-white{% endif %} me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
        {% endfor %}
    {% endif %}
</div>
